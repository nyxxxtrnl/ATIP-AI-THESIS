services:
  - type: web
    name: atip-ai-thesis-demo
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: ATIP_SECURE_COOKIE
        value: "true"
      - key: ATIP_DATA_DIR
        value: /var/data
    disk:
      name: atip-demo-data
      mountPath: /var/data
      sizeGB: 1
